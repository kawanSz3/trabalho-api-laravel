$kind: http-request
url: "{{baseUrl}}/tarefas/{{tarefaId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Tarefa encontrada', function () { pm.response.to.have.status(200); });
      pm.test('Resource contém título', function () { pm.expect(pm.response.json().data).to.have.property('titulo'); });
order: 3000
